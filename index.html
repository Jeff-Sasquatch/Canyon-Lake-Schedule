<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>McCoy's Canyon Lake Construction Schedule</title><style id="css">
:root{--navy:#1d4f73;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--band:#f6f8fa;--green:#2fb344;--red:#d63939;--teal:#3d8a95;--gray:#c9ced4;--purple:#8a1a9b;--rowh:26px}
*{box-sizing:border-box}
body{margin:0;font:12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff}
header{padding:16px 20px 10px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools label{color:var(--muted);display:flex;gap:6px;align-items:center}
.tools input[type=date]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
button{font:inherit;padding:6px 12px;border:1px solid #cfd6dd;background:#fff;border-radius:6px;cursor:pointer}
button:hover{background:var(--band)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
button.primary:disabled{background:#9fb3c2;border-color:#9fb3c2;cursor:default}
#msg{color:var(--muted);min-width:150px}
#msg.dirty{color:#b45309;font-weight:600}
.wrap{overflow:auto;max-height:calc(100vh - 120px);position:relative;border-bottom:1px solid var(--line)}
.grid{position:relative;min-width:max-content}
.row{display:flex;height:var(--rowh);border-bottom:1px solid var(--line)}
.row.hdr{height:40px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #cfd6dd}
.left{position:sticky;left:0;z-index:3;display:flex;background:#fff;border-right:1px solid #cfd6dd}
.row.hdr .left{z-index:6}
.c{padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.c:last-child{border-right:0}
.hdr .c{font-weight:700;font-size:11px;justify-content:center;background:#fff}
.c.num{justify-content:center;color:var(--muted)}
.c.ctr{justify-content:center}
.c.r{justify-content:flex-end}
.c.logic{color:var(--muted);font-size:11px;background:var(--band)}
.w-id{width:34px}.w-name{width:240px}.w-d{width:68px}.w-dur{width:62px}.w-p{width:62px}.w-my{width:72px}.w-st{width:84px}.w-lg{display:none}.w-db{width:64px}.hide-db .w-db{display:none}
.lvl0 .c,.lvl1 .c{font-weight:700}
.lvl1 .left,.lvl0 .left{background:#fbfcfd}
.name{gap:4px}
.lvl2 .name{padding-left:22px}
.lvl1 .name{padding-left:8px}
.tog{border:0;background:none;padding:0 2px;width:14px;font-weight:700;color:var(--navy);cursor:pointer}
.my input{width:58px;font:inherit;text-align:right;padding:2px 4px;border:1px solid #cfd6dd;border-radius:4px;background:#fffbea}
.my input.chg{border-color:#d97706;background:#fff1d6;font-weight:600}
.my input:focus{outline:2px solid var(--navy);outline-offset:0}
.st{gap:5px;font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.done{color:var(--green)}
.gantt{position:relative;flex:none}
.hdr .gantt{display:flex;flex-direction:column}
.yr,.mo{position:relative;height:20px}
.yr div,.mo div{position:absolute;top:0;height:100%;border-left:1px solid #cfd6dd;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.yr div{font-weight:700;color:var(--ink)}
.mo{border-top:1px solid var(--line)}
.vline{position:absolute;top:0;bottom:0;width:1px;background:#eef1f4}
.today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid #3c4a57;z-index:2}
.hdr .gantt{position:relative}.todaytag{position:absolute;top:2px;transform:translateX(-50%);background:#7cc4d0;color:#0d3b44;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap;z-index:1}
.bar{position:absolute;top:7px;height:12px;border-radius:2px;background:var(--gray);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0}
.bar.par{top:9px;height:7px;background:var(--navy)}
.bar.par .fill{background:#6fcf7f}
.lbl{position:absolute;top:0;height:var(--rowh);display:flex;align-items:center;font-size:11px;color:#55606c;white-space:nowrap;pointer-events:none}
.ms{position:absolute;top:7px;width:11px;height:11px;transform:rotate(45deg);background:var(--purple)}
#links{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
#links path{fill:none;stroke:#9aa5b1;stroke-width:1}
.bars{position:absolute;inset:0;z-index:2}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 20px;color:var(--muted);align-items:center}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:22px;height:8px;border-radius:2px}
.note{margin-left:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:8px 14px;border-radius:6px;display:none;z-index:20}
.my input.oac{border-color:#3b82f6;background:#dbeafe;font-weight:600}
.oac{display:flex;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:stretch;flex-wrap:wrap}
.dz{flex:0 0 360px;min-height:92px;border:2px dashed #9fb3c2;border-radius:10px;background:#f7fafc;display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:background .15s,border-color .15s}
.dz:hover,.dz.over{background:#eaf3fb;border-color:var(--navy)}
.dz.busy{cursor:progress;border-style:solid;border-color:#3b82f6;background:#eef5ff}
.dz.busy .dzi{animation:pulse 1.2s infinite}
.dz.off{cursor:default;opacity:.75}
@keyframes pulse{50%{opacity:.3}}
.dzi{font-size:24px;color:var(--navy);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #cfd6dd;display:flex;align-items:center;justify-content:center;flex:none}
#dzt{font-size:13px}#dzt span{color:var(--muted);font-size:12px}
.mpanel{flex:1 1 400px;min-width:280px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.mh{font-weight:700;font-size:13px;margin-bottom:4px}
.empty{color:var(--muted);padding:4px 0}
.meet{border-top:1px solid var(--line);padding:4px 0}
.meet summary{cursor:pointer;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.mdate{font-weight:600}.mcount{color:var(--teal);font-weight:600}.mfiles{color:var(--muted);font-size:11px}
.mfiles a{color:var(--navy)}
.msum{margin:6px 0;color:#3c4a57}
.mch{margin:4px 0 6px;padding-left:18px}.mch li{margin:2px 0}
.ev{color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(15,23,32,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.mbox{background:#fff;border-radius:12px;max-width:1000px;width:100%;max-height:90vh;display:flex;flex-direction:column;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 10px;font-size:18px}
.mrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mrow label{color:var(--muted);display:flex;gap:6px;align-items:center}
.mrow input{font:inherit;padding:4px 6px;border:1px solid #cfd6dd;border-radius:6px}
.files{color:var(--muted);font-size:11px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th{position:sticky;top:0;background:#f6f8fa;text-align:left;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r{text-align:right;white-space:nowrap}.tbl td.num{color:var(--muted)}
.tbl tr.same{opacity:.55}
.tbl .pv{width:56px;font:inherit;text-align:right;padding:2px 4px;border:1px solid #3b82f6;border-radius:4px;background:#dbeafe}
.grp{color:var(--muted);font-size:11px}
.cf{font-size:10px;padding:1px 6px;border-radius:8px;text-transform:uppercase;font-weight:700}
.cf.high{background:#dcfce7;color:#166534}.cf.medium{background:#fef3c7;color:#92400e}.cf.low{background:#fee2e2;color:#991b1b}
.mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}

.late{color:var(--red)}.ahead{color:var(--teal);font-size:11px}.zero{color:var(--muted)}

button.primary.saved:disabled{background:#e7f6ea;border-color:#b7e1c0;color:#1e7b34;font-weight:600}
.readnote{color:var(--muted);font-size:12px;margin:2px 0 4px}.warn{background:#fff4e5;border:1px solid #f5c27a;color:#7a4b00;border-radius:8px;padding:8px 10px;margin:6px 0}.dz.err{border-style:solid;border-color:var(--red);background:#fdecec;cursor:pointer}.dz.err .dzi{color:var(--red)}.errmsg{color:#991b1b!important;font-weight:600;word-break:break-word}.errhint{font-style:italic}
:root{--mc-green:#00573D;--mc-yellow:#FFEA00}
header{background:var(--mc-green);color:var(--mc-yellow);border-bottom:3px solid var(--mc-yellow);align-items:center}
header h1,header .sub,header .sub b,header .tools label,header #msg,header #msg.dirty{color:var(--mc-yellow)}
header .sub{opacity:.92}

bing & Electrical Rough In) or not clearly attributable to a specific site-utility percentage, so no changes are proposed. Page 37 shows an open trench with PVC pipe runs and a test fitting being installed. Pages 38\u201339 show underground plumbing water/standpipe tests marked 9/22 3pm and 9/23 1:35pm, with water held in vertical PVC risers near electrical conduit stub-ups.","files":[{"name":"OAC Meeting #7 - 9-24-2026.pdf","url":"/_blob/ead5a5e3132d1e768f65e6c65761bb88","id":"ead5a5e3132d1e768f65e6c65761bb88"}],"changes":[{"id":9,"from":35,"to":40,"evidence":"Photos on pages 6\u20138 show underground conduit runs laid in an open trench and a braced bank of conduit stub-ups, indicating site utility work is progressing but not yet backfilled. \u00b7 Photos on pp. 9-12 show multiple runs of underground conduit placed in an open trench and stubbed up at a rack, still awaiting backfill. \u00b7 Photos on pp. 13-16 show multiple underground conduit runs installed in long open trenches across the site, consistent with Site Utilities progressing beyond the current 35%. \u00b7 Photos on pp. 17\u201320 show multiple underground conduit runs (labeled 'DATA') installed in an open site trench awaiting backfill, and Site Utilities is listed as ongoing in the look-ahead. \u00b7 Photos on pages 21-24 show long trench runs with multiple conduits installed, conduit stub-ups, and PVC piping staged, indicating site utility work continuing beyond the prior 35%. \u00b7 Photos on pp. 25\u201327 show long excavated utility trenches with multiple conduit runs laid and stub-ups in place, not yet backfilled, indicating site utilities are actively progressing. \u00b7 Page 37 photo shows PVC utility piping placed in an open trench with a test fitting, indicating continued underground utility installation beyond the prior 35%."}],"read":{"pdfs":1,"pages":39,"photos":0,"viewed":39,"total":39},"added":"2026-11-10T17:03:30.343Z"},{"id":1794330247515,"date":"2026-10-01","no":"8","label":"OAC #8 10/01/26","summary":"OAC Meeting #8 reports no safety issues, zero logged delays, and an unchanged substantial completion date of 5/20/2027; the Drive-Thru building pad was completed 9/30/2026, and site grading, site utilities, and Sales Floor foundations/forming appear in the activities and 3-week look-ahead. Old Business lists the Nucor PEMB delivery as 10/26/2026, and RFI 008 (Concrete Foundations, submitted 9/30) is still open. Both conflict with the current OAC values showing PEMB Delivery at 100%, Erect PEMB at 40%, and Sales Floor Concrete Foundation at 100%, so those figures should be verified even though this proposal does not lower them. The attached pages contain no site photos (rendered pages 1 and 4 appear blank; pages 2\u20133 are submittal and agenda text only), so there is no visual progress evidence. From the photos / later pages: Page 5 is a blank delay log with 0 days of critical path delay, and page 6 renders blank (its RFI log text shows RFI for Concrete Foundations still open). Page 7 shows prefabricated rebar cages and mats staged on the graded pad for foundations, and page 8 shows an open utility trench with PVC conduit stub-ups. Page 9 shows a backhoe trenching for site utilities while crews work in the open trench, with white PVC stub-ups along the adjacent pad. Page 10 shows a rough-graded area with stockpiled rock and silt fencing along the perimeter, so site grading and fill are still in progress.","files":[{"name":"OAC Meeting #8 - 10-1-2026.pdf","url":"/_blob/c77ceb2a82f70b9179d21f1f311381ca","id":"c77ceb2a82f70b9179d21f1f311381ca"}],"changes":[{"id":9,"from":40,"to":45,"evidence":"Page 8 photo shows an excavated utility trench with grouped PVC conduit stub-ups installed, so site utilities work is progressing. \u00b7 Page 9 photo shows active utility trenching by backhoe with crews working in the trench, and Site Utilities is listed in the 3-week look-ahead."}],"read":{"pdfs":1,"pages":10,"photos":0,"viewed":10,"total":10},"added":"2026-11-10T17:04:07.515Z"},{"id":1794330295390,"date":"2026-10-08","no":"9","label":"OAC #9 10/08/26","summary":"In OAC Meeting #9, foundation work is still underway. Sales floor footings were poured on 10/8, footings and grade beams are scheduled for 10/13, and slab forming and electrical grounding review are expected around 10/15, while site grading, site utilities and drive-thru canopy underground work continue. The delay log shows 4 critical-path days lost to rain and mud (10/1\u201310/4), and the Nucor PEMB delivery date is listed as 10/26/2026. Several current schedule values (PEMB Delivery 100%, Concrete Foundation 100%, Concrete Slab 100%, Erect PEMB 40%) appear ahead of what this report describes, but none were lowered; the attached pages contain no site photos, and pages 1 and 3 rendered blank. From the photos / later pages: Page 5 renders blank. Pages 6\u20138 are site photos showing an excavated spread-footing pit with spoil piles and survey equipment (p.6), formed footing/grade-beam trenches with PVC downspout and conduit stub-ups (p.7), and a Tesmec rock trencher working on the graded pad (p.8). Note: the look-ahead lists footing and grade-beam pours on 10/8 and 10/13 and a PEMB delivery date of 10/26/2026, which conflicts with the current 100% values for Concrete Foundation (19), Concrete Slab (20) and PEMB Delivery (3), so those prior figures should be reviewed.","files":[{"name":"OAC Meeting #9 - 10-8-2026.pdf","url":"/_blob/3850770cdc0f77cd183a88d94d550182","id":"3850770cdc0f77cd183a88d94d550182"}],"changes":[{"id":9,"from":45,"to":50,"evidence":"Site Utilities and Drive Thru underground utilities are in the look-ahead (p.1), and trenching equipment is active on site (p.8)."}],"read":{"pdfs":1,"pages":8,"photos":0,"viewed":8,"total":8},"added":"2026-11-10T17:04:55.390Z"},{"id":1794330320582,"date":"2026-10-14","no":"10","label":"OAC #10 10/14/26","summary":"OAC Meeting #10 reports no safety issues, no outstanding RFIs, PCOs or ASIs, one approved deduct change ($2,003 fence fabric), and a 4-day critical-path rain/mud delay (10/1\u201310/4/2026) against the 5/20/2027 contractual substantial completion. The 3-week look-ahead shows site grading/fill and site utilities ongoing, Sales Floor footings/grade beams pouring 10/14, grounding 10/15, slab 10/16, and Nucor PEMB delivery and column standing on 10/26. This contradicts the current OAC values of 100% for PEMB Delivery (id 3) and 100% for Concrete Foundation and Concrete Slab (ids 19, 20), and 40% for Erect PEMB (id 21), so those values should be reviewed. No site photos were included: pages 1 and 3 rendered blank, and pages 2 and 4 are text and log pages only, so no updates are proposed. From the photos / later pages: The attached image of page 5 renders as a blank white page with no visible content or site photos. The page 5 text is the RFI log (RFIs 001\u2013013, all answered), which records design clarifications rather than percent complete, so it supports no changes to the current OAC values.","files":[{"name":"OAC Meeting #10 - 10-14-2026.pdf","url":"/_blob/200d3521acb2f7261831b104b7bb9e41","id":"200d3521acb2f7261831b104b7bb9e41"}],"changes":[],"read":{"pdfs":1,"pages":5,"photos":0,"viewed":5,"total":5},"added":"2026-11-10T17:05:20.582Z"},{"id":1794330376974,"date":"2026-10-22","no":"11","label":"OAC #11 10/22/26","summary":"As of OAC #11, site grading/fill and site utilities are ongoing. The porch/canopy foundation pour is scheduled for 10/23/2026, and Nucor PEMB delivery and column setting are expected the week of 10/26/2026. Two weather delays totaling 7 critical-path days are logged (rain/mud 10/1\u201310/4 on foundations, high winds 10/16\u201310/19 on the slab), and there are no outstanding RFIs, PCOs, ASIs or pay apps. No site photos appear in this pass (rendered pages 1 and 3 are blank). Several schedule values look ahead of the report and should be checked: PEMB Delivery (id 3) is at 100% although delivery is still pending, and Drive Thru foundations/UG (ids 44\u201346) are at 100% while batter boards, electrical undergrounds and fire riser rough-in are still in the look-ahead. From the photos / later pages: Pages 5 and 6 rendered as blank images. Page 7 shows a trencher cutting a long utility trench across the graded site, and page 8 shows large-diameter blue pipe placed in an open trench beside the poured slab, with batter boards set nearby. The attached pages are site photos. They show a motor grader and wheel loader still grading along the road frontage, with disturbed earth and form stakes near the fence line. A large poured concrete slab with embedded stubs is visible, but no erected PEMB steel appears.","files":[{"name":"OAC Meeting #11 - 10-22-2026.pdf","url":"/_blob/7adb46ef9985b9c0e444813148f476b0","id":"7adb46ef9985b9c0e444813148f476b0"}],"changes":[],"read":{"pdfs":1,"pages":11,"photos":0,"viewed":11,"total":11},"added":"2026-11-10T17:06:16.974Z"},{"id":1794330416765,"date":"2026-10-28","no":"12","label":"OAC #12 10/28/26","summary":"OAC Meeting #12 reports no safety issues and 7 critical-path delay days logged, from rain/mud on concrete foundations (10/1\u201310/4) and high winds that prevented slab placement (10/16\u201310/19); original substantial completion remains 5/20/2027. The 3-week look-ahead lists site concrete, storm/sewer/water utilities, metal building erection, interior framing (11/30), and drive-thru canopy, fire riser, ground loop and slab (11/10). These are listed as upcoming or ongoing without stated percentages or completions, so no changes are proposed. Two RFIs are open (016 Split-System A/C, 017 Anchor Bolt Relocation, which could affect PEMB erection), and only change order 001 (fence fabric deduct, -$2,003) is approved. The attached images for pages 1 and 3 rendered blank, and no site photos were included in this pass. From the photos / later pages: Pages 5 and 6 rendered blank, so the RFI log had to be read from the text. Page 7 shows metal wall/roof panels and secondary framing (purlins/girts) staged on dunnage in a laydown yard; page 8 shows primary PEMB frame members stacked on a finished concrete slab, with no erected steel visible. Page 9 is a site photo showing large-diameter black corrugated HDPE storm pipe being laid in an open trench along the perimeter fence line, with an excavator and a crew working the trench. A loader and other equipment are in the background.","files":[{"name":"OAC Meeting #12 - 10-29-2026.pdf","url":"/_blob/d16f9bcdbf96c4cad59c3becd2aaffb0","id":"d16f9bcdbf96c4cad59c3becd2aaffb0"}],"changes":[{"id":9,"from":50,"to":55,"evidence":"Page 9 photo shows storm drain pipe actively being installed in a trench, and the report's look-ahead lists ongoing Storm Water, Sewer and Water utility work."}],"read":{"pdfs":1,"pages":9,"photos":0,"viewed":9,"total":9},"added":"2026-11-10T17:06:56.766Z"},{"id":1794330471926,"date":"2026-11-05","no":"13","label":"OAC #13 11/05/26","summary":"OAC Meeting #13 reports no safety issues and 10 critical-path delay days logged (rain/mud 10/1\u201310/4, high winds 10/16\u201310/19, rain 10/29\u201311/2). The most recent rain delay prevented the start of PEMB erection, and the 3-week look-ahead lists metal building erection, interior framing, drive-thru canopy, ground loop, and site and utility work (storm, sewer, water, asphalt patching) as upcoming, with the drive-thru concrete slab dated 11/6/2026. RFI 018 (Septic Area Electrical Routing) is open, Pay App #4 is being processed, and new business covers pressure washing structural steel and drive-thru electrical grounding photos. The attached images of pages 1 and 3 rendered blank, pages 2 and 4 are text and tables only, and there are no site photos showing progress. The report gives no percentages or completions that would raise any activity above its current OAC %, so no updates are proposed. From the photos / later pages: Pages 5\u20137 rendered blank in the attached images (their RFI log text is in the report text: RFIs 001\u2013017 answered, 018 Septic Area Electrical Routing open). Page 8 is a site photo of a large formed area with a rebar mat and conduit stubs set, ready for a concrete pour, with workers on site. It is most likely the drive-thru slab, which is already at 100%. Pages 9-10 show PEMB primary frames, columns, rafters and much of the purlin/girt framing erected over the sales floor slab, with lifts working and more steel members staged on the slab. No roof or wall sheeting is visible yet. Page 11 shows an open storm drain trench beside the building with corrugated pipe and a fitting being installed.","files":[{"name":"OAC Meeting #13 - 11-05-2026.pdf","url":"/_blob/b646ed87bd460229fdfd45281bd3dfa9","id":"b646ed87bd460229fdfd45281bd3dfa9"}],"changes":[{"id":9,"from":55,"to":60,"evidence":"Photo (p. 11) shows storm drain pipe being laid in an open trench along the building, consistent with ongoing storm water utility work listed in the look-ahead."},{"id":21,"from":40,"to":50,"evidence":"Photos (pp. 9-10) show primary frames and most secondary framing erected, but no roof or wall panels installed yet."}],"read":{"pdfs":1,"pages":11,"photos":0,"viewed":11,"total":11},"added":"2026-11-10T17:07:51.926Z"}]}</script><script id="app">
(function(){
var TITLE="McCoy's Canyon Lake Construction Schedule";
var PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/";
var STATE=JSON.parse(document.getElementById('state').textContent);
var A=STATE.activities, MY=Object.assign({},STATE.my||{}), SRC=Object.assign({},STATE.src||{}), MEET=(STATE.meetings||[]).slice();
var SAVED=JSON.stringify(STATE.my||{});
var DAY=86400000, PX=3.1, RH=26;
var G0=Date.UTC(2026,5,1), G1=Date.UTC(2027,8,1);
var GW=Math.round((G1-G0)/DAY*PX);
var collapsed={};
var artifactNS=null, sampleNS=null, assetsNS=null, capsReady=false;
var pending=null; // proposal under review
function pd(s){var p=s.split('/');return Date.UTC(2000+ +p[2],+p[0]-1,+p[1]);}
function x(t){return (t-G0)/DAY*PX;}
function wd(a,b){var n=0;for(var t=a;t<=b;t+=DAY){var g=new Date(t).getUTCDay();if(g&&g<6)n++;}return n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
A.forEach(function(a){a.s=pd(a.start);a.e=pd(a.end);});
var byId={};A.forEach(function(a){byId[a.id]=a;});
var parent={},cur=null;A.forEach(function(a){if(a.lvl===1)cur=a.id;else if(a.lvl===2)parent[a.id]=cur;});
var succ={};A.forEach(function(a){if(!a.pred)return;a.pred.split(';').forEach(function(p){var m=p.match(/^(\d+)(.*)$/);if(!m)return;(succ[m[1]]=succ[m[1]]||[]).push(a.id+m[2]);});});
function myPct(a){return (a.id in MY)?MY[a.id]:a.rep;}
function pct(a){
  if(a.lvl===2)return myPct(a);
  var kids=A.filter(function(k){return k.lvl===2&&(a.lvl===0||parent[k.id]===a.id);});
  var w=0,s=0;kids.forEach(function(k){w+=k.dur;s+=k.dur*myPct(k);});
  return w?s/w:(kids.length?kids.reduce(function(t,k){return t+myPct(k);},0)/kids.length:0);
}
function statusDate(){var el=document.getElementById('sd');var v=el&&el.value;if(!v)return Date.now();var p=v.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function planned(a,sd){if(sd<a.s)return 0;if(sd>=a.e)return 100;var tot=wd(a.s,a.e);return tot?wd(a.s,sd)/tot*100:100;}
function groupPlanned(a,sd){var w=0,s=0;A.forEach(function(k){if(k.lvl===2&&(a.lvl===0||parent[k.id]===a.id)){w+=k.dur;s+=k.dur*planned(k,sd);}});return w?s/w:planned(a,sd);}
function status(a,p,sd){
  if(p>=99.995)return{k:'Completed',c:'var(--green)'};
  var pl=a.lvl<2?groupPlanned(a,sd):planned(a,sd);
  if(p<=0&&pl<=0)return{k:'Uninitiated',c:'var(--gray)'};
  if(p+0.005>=pl)return{k:p>pl+0.005?'Ahead':'On track',c:'var(--teal)'};
  return{k:sd>a.e?'Overdue':'Behind',c:'var(--red)',t:'Planned '+pl.toFixed(0)+'% by status date'};
}
function behindRaw(a,p,sd){
  if(a.lvl<2){var w=null;A.forEach(function(k){if(k.lvl===2&&(a.lvl===0||parent[k.id]===a.id)){var v=behindRaw(k,myPct(k),sd);if(w===null||v>w)w=v;}});return w||0;}
  if(p>=99.995)return 0;
  if(a.dur===0)return sd>a.s?wd(a.s+DAY,sd):0;
  var el=sd<a.s?0:wd(a.s,sd),tot=wd(a.s,a.e);
  return el-p/100*tot;
}
function behindDays(a,p,sd){var v=behindRaw(a,p,sd);return v>0.01?Math.ceil(v-0.01):(v<-0.01?-Math.floor(-v+0.01):0);}
function behindCell(n){return n>0?'<b class="late">'+n+'</b>':(n<0?'<span class="ahead">'+(-n)+' ahead</span>':'<span class="zero">0</span>');}
function f2(n){return (Math.round(n*100)/100).toFixed(2)+'%';}
function visible(a){return !(a.lvl===2&&collapsed[parent[a.id]]);}
function sameDay(a,b){var d=new Date(b);return Math.floor(a/DAY)===Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);}
function fmtShort(t){var d=new Date(t);return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];}

function render(){
  var sd=statusDate();
  var rows=A.filter(visible);
  var h='<div class="row hdr"><div class="left">'+
   '<div class="c w-id">#</div><div class="c w-name">Activity</div><div class="c w-d">Start</div><div class="c w-dur">Duration</div><div class="c w-d">End</div>'+
   '<div class="c w-p" title="Progress as reported on the contractor\'s 09/16/26 schedule">Report %<br>09/16</div><div class="c w-my" title="Progress from OAC meeting reports (or your own entry)">OAC %</div><div class="c w-st">Status</div><div class="c w-db" title="Workdays behind plan as of the status date: workdays elapsed since the activity start minus workdays earned (OAC % × duration). Group rows show their most-behind activity.">Days<br>Behind</div>'+
   '<div class="c w-lg">Predecessors</div><div class="c w-lg">Successors</div></div>'+
   '<div class="gantt" style="width:'+GW+'px">'+yearRow()+monthRow()+'</div></div>';
  rows.forEach(function(a){
    var p=pct(a),st=status(a,p,sd),edit=a.lvl===2;
    var name=(a.lvl<2?'<button class="tog" data-t="'+a.id+'" aria-label="Toggle group">'+(a.lvl===1?(collapsed[a.id]?'+':'−'):'')+'</button>':'')+'<span title="'+esc(a.name)+'">'+esc(a.name)+'</span>';
    var chg=(a.id in MY&&MY[a.id]!==a.rep)||(a.id in SRC);
    var tip=SRC[a.id]?'From '+SRC[a.id]+' (report: '+f2(a.rep)+')':'Changed from report ('+f2(a.rep)+')';
    var my=edit?'<input type="number" min="0" max="100" step="any" inputmode="decimal" data-id="'+a.id+'" value="'+(+myPct(a).toFixed(2))+'"'+(chg?' class="chg'+(SRC[a.id]?' oac':'')+'" title="'+esc(tip)+'"':'')+'>':'<span'+(p>=99.995?' class="done"':'')+'>'+f2(p)+'</span>';
    h+='<div class="row lvl'+a.lvl+'"><div class="left">'+
      '<div class="c w-id num">'+a.id+'</div><div class="c w-name name">'+name+'</div>'+
      '<div class="c w-d ctr">'+a.start+'</div><div class="c w-dur ctr">'+a.dur+' days</div><div class="c w-d ctr">'+a.end+'</div>'+
      '<div class="c w-p r'+(a.rep>=100?' done':'')+'">'+f2(a.rep)+'</div><div class="c w-my my r">'+my+'</div>'+
      '<div class="c w-st st" title="'+(st.t||'')+'"><span class="dot" style="background:'+st.c+'"></span>'+st.k+'</div>'+
      '<div class="c w-db r" title="'+(a.lvl<2?'Most-behind activity in this group':'Workdays behind plan')+'">'+behindCell(behindDays(a,p,sd))+'</div>'+
      '<div class="c w-lg logic" title="'+esc(a.pred)+'">'+esc(a.pred)+'</div><div class="c w-lg logic" title="'+esc((succ[a.id]||[]).join(';'))+'">'+esc((succ[a.id]||[]).join(';'))+'</div></div>'+
      '<div class="gantt" style="width:'+GW+'px"></div></div>';
  });
  var g=document.getElementById('grid');g.innerHTML=h;
  var leftW=g.querySelector('.row.hdr .left').offsetWidth;
  var top0=40, H=rows.length*RH;
  var ov='<div class="bars" style="left:'+leftW+'px;top:'+top0+'px;width:'+GW+'px;height:'+H+'px">';
  for(var y=2026,m=5;;){var t=Date.UTC(y,m,1);if(t>=G1)break;ov+='<div class="vline" style="left:'+x(t)+'px"></div>';m++;if(m>11){m=0;y++;}}
  var pos={};
  rows.forEach(function(a,i){
    var p=pct(a),st=status(a,p,sd),xs=x(a.s),xe=x(a.e+DAY),yy=i*RH,lblX;
    pos[a.id]={xs:xs,xe:xe,y:yy+RH/2};
    if(a.dur===0){ov+='<div class="ms" style="left:'+(x(a.s+DAY/2)-5.5)+'px;top:'+(yy+7)+'px;'+(p>=99.995?'background:var(--green)':'')+'" title="'+esc(a.name)+' — '+a.start+'"></div>';pos[a.id].xs=pos[a.id].xe=x(a.s+DAY/2);lblX=x(a.s+DAY/2)+10;}
    else if(a.lvl<2){ov+='<div class="bar par" style="left:'+xs+'px;width:'+(xe-xs)+'px;top:'+(yy+9)+'px" title="'+esc(a.name)+' '+f2(p)+'"><div class="fill" style="width:'+p+'%"></div></div>';lblX=xe+6;}

    b.textContent='Save changes';updMsg();
    var c=e&&(e.code||e.message)||'';
    if(/conflict/.test(c))toast('Someone else saved first — reloading their version');
    else if(/not_granted|not_writer/.test(c))toast('This view is read-only');
    else toast('Save failed: '+c);
  });
}
function csv(){
  var sd=statusDate();
  var L=[['#','Activity','Start','Duration (days)','End','Report % (09/16/26)','OAC %','Source','Status','Days Behind','Predecessors','Successors']];
  A.forEach(function(a){var p=pct(a);L.push([a.id,(a.lvl===2?'  ':'')+a.name,a.start,a.dur,a.end,a.rep.toFixed(2),p.toFixed(2),SRC[a.id]||'',status(a,p,sd).k,behindDays(a,p,sd),a.pred,(succ[a.id]||[]).join(';')]);});
  return L.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\n');
}
